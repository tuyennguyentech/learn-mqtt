[package]
name = "mqtt"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
pretty_env_logger = "0.5.0"
rumqttc = "0.25.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "aps"
path = "src/bin/asyncpubsub.rs"

[[bin]]
name = "aps100"
path = "src/bin/asyncpubsub100devices.rs"
